<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found — SDSN Indonesia</title>
    <meta name="description"
        content="Oops! The page you are looking for does not exist. Return to the SDSN Indonesia homepage." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <style>
        /* ===== SDG Color Palette ===== */
        :root {
            --sdg-1: #E5243B;
            --sdg-2: #DDA63A;
            --sdg-3: #4C9F38;
            --sdg-4: #C5192D;
            --sdg-5: #FF3A21;
            --sdg-6: #26BDE2;
            --sdg-7: #FCC30B;
            --sdg-8: #A21942;
            --sdg-9: #FD6925;
            --sdg-10: #DD1367;
            --sdg-11: #FD9D24;
            --sdg-12: #BF8B2E;
            --sdg-13: #3F7E44;
            --sdg-14: #0A97D9;
            --sdg-15: #56C02B;
            --sdg-16: #00689D;
            --sdg-17: #19486A;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: #f8fafc;
            color: #121416;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ===== SDG Rainbow Bar (top) ===== */
        .sdg-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            display: flex;
            z-index: 100;
        }

        .sdg-bar span {
            flex: 1;
            animation: barPulse 3s ease-in-out infinite;
        }

        @keyframes barPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Stagger the pulse */
        .sdg-bar span:nth-child(1) {
            background: var(--sdg-1);
            animation-delay: 0s;
        }

        .sdg-bar span:nth-child(2) {
            background: var(--sdg-2);
            animation-delay: 0.15s;
        }

        .sdg-bar span:nth-child(3) {
            background: var(--sdg-3);
            animation-delay: 0.3s;
        }

        .sdg-bar span:nth-child(4) {
            background: var(--sdg-4);
            animation-delay: 0.45s;
        }

        .sdg-bar span:nth-child(5) {
            background: var(--sdg-5);
            animation-delay: 0.6s;
        }

        .sdg-bar span:nth-child(6) {
            background: var(--sdg-6);
            animation-delay: 0.75s;
        }

        .sdg-bar span:nth-child(7) {
            background: var(--sdg-7);
            animation-delay: 0.9s;
        }

        .sdg-bar span:nth-child(8) {
            background: var(--sdg-8);
            animation-delay: 1.05s;
        }

        .sdg-bar span:nth-child(9) {
            background: var(--sdg-9);
            animation-delay: 1.2s;
        }

        .sdg-bar span:nth-child(10) {
            background: var(--sdg-10);
            animation-delay: 1.35s;
        }

        .sdg-bar span:nth-child(11) {
            background: var(--sdg-11);
            animation-delay: 1.5s;
        }

        .sdg-bar span:nth-child(12) {
            background: var(--sdg-12);
            animation-delay: 1.65s;
        }

        .sdg-bar span:nth-child(13) {
            background: var(--sdg-13);
            animation-delay: 1.8s;
        }

        .sdg-bar span:nth-child(14) {
            background: var(--sdg-14);
            animation-delay: 1.95s;
        }

        .sdg-bar span:nth-child(15) {
            background: var(--sdg-15);
            animation-delay: 2.1s;
        }

        .sdg-bar span:nth-child(16) {
            background: var(--sdg-16);
            animation-delay: 2.25s;
        }

        .sdg-bar span:nth-child(17) {
            background: var(--sdg-17);
            animation-delay: 2.4s;
        }

        @keyframes rhythmicBump {

            0%,
            20%,
            100% {
                transform: translateY(0);
            }

            10% {
                transform: translateY(-12px);
            }
        }

        /* ===== Central Content ===== */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 700px;
        }

        /* ===== Spinning Wheel Container ===== */
        .wheel-scene {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 2rem;
        }

        .wheel-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: wheelSpin 12s linear infinite;
            filter: drop-shadow(0 8px 32px rgba(229, 36, 59, 0.2));
        }

        @keyframes wheelSpin {
            to {
                transform: rotate(360deg);
            }
        }


        /* Orbiting SDG Icons */
        .orbit {
            position: absolute;
            inset: -40px;
            animation: orbitSpin 20s linear infinite;
        }

        .orbit-icon {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            animation: counterSpin 20s linear infinite;
        }

        .orbit-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes orbitSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes counterSpin {
            to {
                transform: rotate(-360deg);
            }
        }

        /* Place 6 icons around the orbit */
        .orbit-icon:nth-child(1) {
            top: 0;
            left: 50%;
            transform-origin: center;
        }

        .orbit-icon:nth-child(2) {
            top: 25%;
            right: -5px;
        }

        .orbit-icon:nth-child(3) {
            bottom: 25%;
            right: -5px;
        }

        .orbit-icon:nth-child(4) {
            bottom: 0;
            left: 50%;
        }

        .orbit-icon:nth-child(5) {
            bottom: 25%;
            left: -5px;
        }

        .orbit-icon:nth-child(6) {
            top: 25%;
            left: -5px;
        }


        /* ===== Heading ===== */
        .heading {
            font-family: var(--font-display);
            font-size: clamp(4rem, 10vw, 7rem);
            /* Made 404 text massive */
            font-weight: 900;
            line-height: 1.15;
            margin-top: 5rem;
            margin-bottom: 0.5rem;
        }

        .heading span {
            display: inline-block;
            animation: rhythmicBump 3s infinite ease-in-out;
        }

        .subtext {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            color: #4a5568;
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }

        .fun-text {
            font-size: 0.95rem;
            color: #718096;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .fun-text .emoji-bounce {
            display: inline-block;
            animation: emojiBounce 1.5s ease-in-out infinite;
        }

        .fun-text .emoji-bounce:nth-child(2) {
            animation-delay: 0.15s;
        }

        .fun-text .emoji-bounce:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes emojiBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* ===== Back Button ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.85rem 2rem;
            border-radius: 50px;
            background: #19486A;
            color: #fff;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 20px rgba(25, 72, 106, 0.25);
            position: relative;
            overflow: hidden;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--sdg-6), var(--sdg-14));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 30px rgba(25, 72, 106, 0.35);
        }

        .back-btn:hover::before {
            opacity: 1;
        }

        .back-btn span {
            position: relative;
            z-index: 1;
        }

        .back-btn .arrow {
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .back-btn:hover .arrow {
            transform: translateX(-4px);
        }

        /* ===== Footer Note ===== */
        .footer-note {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #a0aec0;
            letter-spacing: 0.05em;
            z-index: 10;
        }

        .footer-note a {
            color: var(--sdg-14);
            text-decoration: none;
            font-weight: 600;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .wheel-scene {
                width: 160px;
                height: 160px;
            }

            .orbit {
                inset: -30px;
            }

            .orbit-icon {
                width: 30px;
                height: 30px;
                border-radius: 6px;
            }
        }
    </style>
</head>

<body>
    <!-- SDG Rainbow Bar -->
    <div class="sdg-bar">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Spinning Wheel with Orbiting Icons -->
        <div class="wheel-scene">

            <img src="./src/assets/SDGs Logo/E SDG Icons WEB/SDG Wheel_Transparent_WEB.png" alt="SDG Wheel"
                class="wheel-img" />
            <div class="orbit">
                <div class="orbit-icon">
                    <img src="./src/assets/SDGs Logo/E SDG Icons WEB/E-WEB-Goal-01.png" alt="SDG 1" />
                </div>
                <div class="orbit-icon">
                    <img src="./src/assets/SDGs Logo/E SDG Icons WEB/E-WEB-Goal-04.png" alt="SDG 4" />
                </div>
                <div class="orbit-icon">
                    <img src="./src/assets/SDGs Logo/E SDG Icons WEB/E-WEB-Goal-07.png" alt="SDG 7" />
                </div>
                <div class="orbit-icon">
                    <img src="./src/assets/SDGs Logo/E SDG Icons WEB/E-WEB-Goal-11.png" alt="SDG 11" />
                </div>
                <div class="orbit-icon">
                    <img src="./src/assets/SDGs Logo/E SDG Icons WEB/E-WEB-Goal-13.png" alt="SDG 13" />
                </div>
                <div class="orbit-icon">
                    <img src="./src/assets/SDGs Logo/E SDG Icons WEB/E-WEB-Goal-17.png" alt="SDG 17" />
                </div>
            </div>
        </div>



        <!-- Heading -->
        <h1 class="heading">404</h1>
        <p class="subtext">
            Oops! The page you're looking for doesn't exist.<br />
            It might have been moved or deleted.
        </p>
        <p class="fun-text">
            But we are still dedicated to sustainable development
            <span class="emoji-bounce">🔍</span>
            <span class="emoji-bounce">🌍</span>
            <span class="emoji-bounce">🌱</span>
        </p>

        <!-- Back Button -->
        <a href="./index.html" class="back-btn">
            <span class="arrow">←</span>
            <span>Back to Home</span>
        </a>
    </div>

    <!-- Footer -->
    <p class="footer-note">
        © 2024 <a href="./index.html">SDSN Indonesia</a> — Sustainable Development Solutions Network
    </p>

    <!-- Heading Animation Script -->
    <script>
        (function () {
            const heading = document.querySelector('.heading');
            if (heading) {
                const text = heading.textContent.trim();
                heading.textContent = ''; // clear original

                let charIndex = 0;
                for (let i = 0; i < text.length; i++) {
                    const charSpan = document.createElement('span');
                    charSpan.textContent = text[i];

                    if (text[i].trim() !== '') {
                        // For just 3 characters (404), maybe pick some nice colors explicitly or stick with sequential
                        const sdgNum = [4, 7, 13, 14][charIndex % 4];
                        charSpan.style.color = `var(--sdg-${sdgNum})`;

                        // Add staggered delay for the bump animation
                        charSpan.style.animationDelay = `${charIndex * 0.1}s`;

                        charIndex++;
                    } else {
                        // Preserve spacing
                        charSpan.innerHTML = '&nbsp;';
                    }
                    heading.appendChild(charSpan);
                }
            }
        })();
    </script>
</body>

</html>
