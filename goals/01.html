<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goal 01: No Poverty — SDSN Indonesia</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;800;900&display=swap"
        rel="stylesheet" />

    <!-- Core Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js" defer></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Styles (Perhatikan perubahan path menjadi ../ ) -->
    <link rel="stylesheet" href="../src/styles/main.css" />
    <link rel="stylesheet" href="../src/styles/sections.css" />

    <style>
        :root {
            --sdg-color: #E5233D;
        }

        html,
        body {
            background-color: var(--sdg-color);
        }

        .goal-curtain-hardcoded {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--sdg-color);
            z-index: 999999;
            transform: translateY(0%);
            will-change: transform;
            pointer-events: none;
        }

        .goal-page-wrapper {
            opacity: 0;
            background-color: var(--bg-primary);
            min-height: 100vh;
        }
    </style>
</head>

<body class="is-loading" data-goal="01"> <!-- MATA KUNCI ADA DI SINI -->

    <div class="goal-curtain-hardcoded" id="enter-curtain"></div>

    <div class="goal-page-wrapper" id="page-wrapper">
        <header class="goal-header">
            <!-- Link Back menuju index.html yang ada di luar folder -->
            <a href="../index.html" class="goal-header__back"><i class="ph-bold ph-arrow-left"></i> Back to Goals</a>
            <img src="../src/assets/logo.png" alt="SDSN Logo"
                style="height: 36px; filter: grayscale(1) invert(1); opacity: 0.5;" />
        </header>

        <section class="goal-hero">
            <!-- Watermark sekarang digeser ke kiri via CSS -->
            <div class="goal-hero__watermark">01</div>

            <div class="goal-hero__inner">
                <div class="goal-hero__content">
                    <span class="goal-hero__label">GOAL 01</span>
                    <h1 class="goal-hero__title" id="inject-title"></h1>
                    <p class="goal-hero__desc" id="inject-desc"></p>
                </div>

                <!-- Logo SDG Besar Rata Kanan -->
                <div class="goal-hero__logo-wrap">
                    <img id="inject-logo" src="" alt="SDG Logo" class="goal-hero__logo" />
                </div>
            </div>
        </section>

        <section class="goal-data">
            <div class="goal-data__inner">
                <div class="goal-data__sticky">
                    <h2 class="goal-data__sticky-title">Indonesia's Pulse</h2>
                    <p id="inject-pulse" style="color: var(--text-secondary); line-height: 1.6; max-width: 400px;"></p>
                </div>
                <div class="goal-data__pulse-grid" id="inject-bento"></div>
            </div>
        </section>

        <section class="goal-targets">
            <div class="goal-targets__inner">
                <h2 class="goal-targets__title">Targets and Indicators</h2>
                <div id="inject-targets"></div>
            </div>
        </section>

        <!-- PASTIKAN BLOK INI SAMA PERSIS -->
        <section class="next-goal" id="next-goal-link">
            <div class="next-goal__bg"></div>
            <div class="next-goal__inner">
                <span class="next-goal__label">Up Next</span>
                <h2 class="next-goal__title">
                    <span class="next-goal__id">02</span>
                    <span class="next-goal__name">Zero Hunger</span>
                    <i class="ph-bold ph-arrow-right next-goal__icon"></i>
                </h2>
            </div>
        </section>

        <!-- FOOTER CONTAINER KOSONG - AKAN DIISI JS -->
        <footer id="footer" class="footer"></footer>

    </div> <!-- Tutup dari .goal-page-wrapper -->

    <!-- Script -->
    <script type="module" src="../src/goal-main.js"></script>
</body>

</html>
